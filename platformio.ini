; CYD Victron display (see SPEC.md)
; The display driver is a build flag: pick the env that matches the board.
;   cyd_ili9341 - ILI9341 panel (default; confirmed on our single USB-C board)
;   cyd_st7789  - ST7789 panel (other CYD revisions)
; If the screen stays blank or garbled, flash the other env. The boot log
; prints which driver was built and what the panel answered.

[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32
board = esp32dev
framework = arduino
; LVGL + WiFi + TLS + the logo don't fit the default 1.2 MB app slot. No OTA in v1.
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  ; registry release (1.3) lacks begin(SPIClass&), needed for the CYD's separate touch bus
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
  lvgl/lvgl @ 9.2.2
build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  ; TFT_eSPI fonts are only used by the calibration screen; LVGL has its own
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1

[env:cyd_st7789]
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER=1
  -DCYD_INVERT=1

[env:cyd_ili9341]
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER=1

; Wokwi simulator build (see wokwi.toml / diagram.json). Not for real hardware.
; The simulated board has no touch controller, so touch and calibration are skipped.
[env:wokwi]
build_flags =
  ${env:cyd_ili9341.build_flags}
  -DWOKWI=1
